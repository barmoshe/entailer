<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" role="img" aria-label="Entailer verdict: INCONSISTENT, minimal conflicting subset {R1, R2, R3}">
  <title>Entailer verdict certificate — spec.md is INCONSISTENT</title>
  <defs>
    <style>
      .serif { font-family: 'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <filter id="cardshadow" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3b342b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- paper card -->
  <rect x="14" y="14" width="892" height="552" rx="18" fill="#f3ead6" stroke="#d8c6a2" stroke-width="1.5" filter="url(#cardshadow)"/>
  <rect x="32" y="32" width="856" height="516" rx="10" fill="none" stroke="#e2d4b6" stroke-width="1"/>

  <!-- header: source + stamp -->
  <text x="60" y="86" class="mono" font-size="22" fill="#6e6353">spec.md</text>
  <text x="60" y="112" class="serif" font-size="24" fill="#3b342b">three requirements, written pages apart</text>

  <!-- INCONSISTENT stamp -->
  <g transform="rotate(-7 760 84)">
    <rect x="648" y="56" width="224" height="56" rx="10" fill="none" stroke="#b5654a" stroke-width="3"/>
    <text x="760" y="93" class="mono" font-size="26" letter-spacing="2" text-anchor="middle" fill="#b5654a" font-weight="700">INCONSISTENT</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="140" x2="860" y2="140" stroke="#e2d4b6" stroke-width="1.5"/>

  <!-- requirements -->
  <g class="mono" font-size="23">
    <text x="60" y="196" fill="#4c6e78">R1<tspan fill="#3b342b" dx="18">Every request must be logged.</tspan></text>
    <text x="60" y="244" fill="#4c6e78">R2<tspan fill="#3b342b" dx="18">Health-check requests must not be logged.</tspan></text>
    <text x="60" y="292" fill="#4c6e78">R3<tspan fill="#3b342b" dx="18">/healthz is a request.</tspan></text>
  </g>

  <!-- conflict brace -->
  <path d="M 830 176 q 14 0 14 16 v 36 q 0 16 14 16 q -14 0 -14 16 v 36 q 0 16 -14 16" fill="none" stroke="#b5654a" stroke-width="2"/>
  <text x="866" y="252" class="mono" font-size="16" fill="#b5654a">can't</text>
  <text x="861" y="272" class="mono" font-size="16" fill="#b5654a">all hold</text>

  <!-- verdict band -->
  <rect x="60" y="336" width="800" height="92" rx="12" fill="#eeddd6" stroke="#b5654a" stroke-width="1.5"/>
  <text x="84" y="374" class="mono" font-size="15" letter-spacing="1.5" fill="#8f4a35">MINIMAL CONFLICTING SUBSET</text>
  <text x="84" y="410" class="mono" font-size="30" fill="#8f4a35" font-weight="700">{ R1, R2, R3 }</text>
  <text x="836" y="392" class="serif" font-style="italic" font-size="26" text-anchor="end" fill="#b5654a">exit 1</text>

  <!-- honesty footer -->
  <text x="460" y="500" class="mono" font-size="17" letter-spacing="0.5" text-anchor="middle" fill="#6e6353">validity &#8800; truth &#8800; faithful-formalization</text>
  <text x="460" y="526" class="serif" font-style="italic" font-size="18" text-anchor="middle" fill="#8a6a49">no verdict ships without the formalization it judged</text>
</svg>
