<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="entailer — does it follow?">
  <title>entailer — a logician's-pass linter for software artifacts</title>
  <defs>
    <style>
      .serif { font-family: 'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="6" flood-color="#3b342b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- paper card -->
  <rect x="16" y="16" width="1168" height="328" rx="20" fill="#f3ead6" stroke="#d8c6a2" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="34" y="34" width="1132" height="292" rx="12" fill="none" stroke="#e2d4b6" stroke-width="1"/>

  <!-- turnstile kicker:  Gamma  ⊨(drawn)  phi -->
  <g fill="#4c6e78">
    <text x="546" y="104" class="mono" font-size="30" text-anchor="middle">&#915;</text>
    <!-- drawn double-turnstile (models) so it renders on any font stack -->
    <g stroke="#4c6e78" stroke-width="2.4" stroke-linecap="round">
      <line x1="594" y1="82" x2="594" y2="106"/>
      <line x1="594" y1="90" x2="612" y2="90"/>
      <line x1="594" y1="98" x2="612" y2="98"/>
    </g>
    <text x="656" y="104" class="mono" font-size="30" text-anchor="middle">&#966;</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="204" class="serif" font-size="118" letter-spacing="-1" text-anchor="middle" fill="#3b342b">entailer</text>

  <!-- tagline -->
  <text x="600" y="252" class="serif" font-style="italic" font-size="34" text-anchor="middle" fill="#6e6353">does it follow?</text>

  <!-- verdict chip strip -->
  <g class="mono" font-size="17" letter-spacing="1.5">
    <!-- VALID (teal) -->
    <rect x="279" y="284" width="118" height="40" rx="20" fill="#dbe4e5" stroke="#4c6e78" stroke-width="1.5"/>
    <text x="338" y="310" text-anchor="middle" fill="#37535c">VALID</text>
    <!-- INVALID (terracotta) -->
    <rect x="415" y="284" width="130" height="40" rx="20" fill="#eeddd6" stroke="#b5654a" stroke-width="1.5"/>
    <text x="480" y="310" text-anchor="middle" fill="#8f4a35">INVALID</text>
    <!-- INCONSISTENT (terracotta) -->
    <rect x="563" y="284" width="190" height="40" rx="20" fill="#eeddd6" stroke="#b5654a" stroke-width="1.5"/>
    <text x="658" y="310" text-anchor="middle" fill="#8f4a35">INCONSISTENT</text>
    <!-- UNKNOWN (neutral) -->
    <rect x="771" y="284" width="150" height="40" rx="20" fill="#e7ddc7" stroke="#9a8b6a" stroke-width="1.5"/>
    <text x="846" y="310" text-anchor="middle" fill="#6e6353">UNKNOWN</text>
  </g>
</svg>
